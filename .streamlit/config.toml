[browser]
gatherUsageStats = false

[client]
showErrorDetails = "none"

[theme]
primaryColor = "#24645D"
backgroundColor = "#F8FAF9"
secondaryBackgroundColor = "#EDF2EF"
textColor = "#172E2A"
font = "sans serif"
